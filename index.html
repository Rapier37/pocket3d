<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pocket3D</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
:root{--bg:#10162b;--panel:#1a2240;--line:#2c3763;--tx:#e8ecfa;--mut:#9aa6cf;--ac:#ff7a3d}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:14px;display:grid;gap:12px}
h1{margin:0;font-size:1.35rem}p{margin:0;color:var(--mut)}
#view{height:56vh;min-height:300px;border:1px solid var(--line);border-radius:10px;background:radial-gradient(circle at 50% 40%,#232d57,#0c1124);overflow:hidden;position:relative;touch-action:none}
#view canvas{display:block;width:100%;height:100%}
#hint{position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);text-align:center;padding:20px;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
label.s{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;font-size:.92rem}
input[type=range]{width:100%;accent-color:var(--ac);height:28px}
.btn{min-height:46px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center}
.btn.main{background:var(--ac);color:#1b0d05;border-color:var(--ac)}
.btn:disabled{opacity:.4}.btn:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
#status{min-height:1.4em;color:var(--ac);font-weight:600}
</style></head><body><main>
<div><h1>Pocket3D</h1><p>Photo in, textured 3D out. Runs fully on this device after the first model download.</p></div>
<div id="view"><div id="hint">Pick a front-facing photo with good light.<br>Face mode builds a real 3D face. Object mode works for things.</div></div>
<div id="status" role="status"></div>
<div class="row">
 <label class="btn main">Choose photo<input id="file" type="file" accept="image/*" hidden></label>
 <label class="row">Mode <select id="mode" class="btn"><option value="face">Face</option><option value="obj">Object</option></select></label>
 <label class="row"><input id="bg" type="checkbox" checked> Remove background (object mode)</label>
</div>
<div class="panel">
 <label class="s">Detail<input id="res" type="range" min="64" max="256" step="32" value="128"><b id="resv">128</b></label>
 <label class="s">Depth<input id="rel" type="range" min="5" max="80" value="35"><b id="relv">35</b></label>
 <label class="s">Thickness<input id="thk" type="range" min="2" max="40" value="8"><b id="thkv">8</b></label>
</div>
<div class="row">
 <button class="btn" id="glb" disabled>Save .glb</button>
 <button class="btn" id="obj" disabled>Save .obj</button>
 <button class="btn" id="stl" disabled>Save .stl (100 mm)</button>
</div>
</main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
const TF='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1';
const $=id=>document.getElementById(id), st=t=>$('status').textContent=t;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{if(!crossOriginIsolated&&!sessionStorage.p3d){sessionStorage.p3d=1;location.reload()}}).catch(()=>{});
navigator.storage?.persist?.();

// ---- viewer
const box=$('view'),ren=new THREE.WebGLRenderer({antialias:true,alpha:true});
ren.setPixelRatio(Math.min(devicePixelRatio,1.5));box.appendChild(ren.domElement);
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(40,1,.01,50);cam.position.set(0,0,2.6);
scene.add(new THREE.HemisphereLight(0xffffff,0x556088,1.6));
const sun=new THREE.DirectionalLight(0xffffff,1.8);sun.position.set(1.5,2,3);scene.add(sun);
const ctl=new OrbitControls(cam,ren.domElement),draw=()=>ren.render(scene,cam);ctl.addEventListener('change',draw);
function fit(){const w=box.clientWidth,h=box.clientHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();draw()}
new ResizeObserver(fit).observe(box);fit();
ren.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();st('Graphics was reset. Reload the page.')});
ren.domElement.addEventListener('webglcontextrestored',draw);

// ---- models (lazy, cached by the browser)
let tf,pipes={};
const prog=d=>{if(d.status==='progress'&&d.file)st(`Downloading ${d.file.split('/').pop()}: ${Math.round(d.progress)}%`)};
async function load(kind,only){
  if(crossOriginIsolated&&tf)tf.env.backends.onnx.wasm.numThreads=Math.min(4,navigator.hardwareConcurrency||2);
  tf??=await import(TF);
  if(pipes[kind])return pipes[kind];
  const D='onnx-community/depth-anything-v2-small';
  if(kind==='depth'){
    for(const device of navigator.gpu&&only!=='wasm'?['webgpu','wasm']:['wasm']){
      try{return pipes.depth=await tf.pipeline('depth-estimation',D,{device,progress_callback:prog})}catch(e){console.warn(device,e)}
    }
    throw new Error('Could not load depth model');
  }
  return pipes.bg=await tf.pipeline('background-removal','Xenova/modnet',{progress_callback:prog});
}

let S=null,busy=false;
// ---- helpers
const tick=()=>new Promise(r=>setTimeout(r,40));  // lets the screen update before heavy work
const crop=(b,sx,sy,sw,sh,L)=>{const k=Math.min(1,L/Math.max(sw,sh)),c=document.createElement('canvas');
  c.width=Math.round(sw*k);c.height=Math.round(sh*k);c.getContext('2d').drawImage(b,sx,sy,sw,sh,0,0,c.width,c.height);return c};
function blur(a,w,h){const o=new Float32Array(a.length);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;
    for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const X=x+i,Y=y+j;if(X>=0&&Y>=0&&X<w&&Y<h){s+=a[Y*w+X];n++}}
    o[y*w+x]=s/n}
  return o}

// ---- face mode: MediaPipe Face Landmarker (478 real 3D points, ~4 MB model)
let FL;
async function faceModel(){
  if(FL)return FL;
  const M='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',{FaceLandmarker,FilesetResolver}=await import(M+'/vision_bundle.mjs');
  const fs=await FilesetResolver.forVisionTasks(M+'/wasm');
  const o=d=>({baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:d},runningMode:'IMAGE',numFaces:1});
  try{FL=await FaceLandmarker.createFromOptions(fs,o('GPU'))}catch(e){FL=await FaceLandmarker.createFromOptions(fs,o('CPU'))}
  return FL}
async function faceShot(bmp){
  const fl=await faceModel();st('Finding face...');await tick();
  let r=fl.detect(crop(bmp,0,0,bmp.width,bmp.height,768)).faceLandmarks[0];if(!r)return null;
  // zoom in on the face and detect again: more texture pixels, steadier landmarks
  const xs=r.map(p=>p.x*bmp.width),ys=r.map(p=>p.y*bmp.height),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
  const side=Math.max(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))*1.4;
  const sx=Math.max(0,cx-side/2),sy=Math.max(0,cy-side/2),c=crop(bmp,sx,sy,Math.min(side,bmp.width-sx),Math.min(side,bmp.height-sy),1024);
  r=fl.detect(c).faceLandmarks[0];if(!r)return null;
  st('Building face mesh...');
  const Del=(await import('https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm')).default,w=c.width,h=c.height,n=r.length,xy=new Float64Array(n*2);
  r.forEach((p,i)=>{xy[2*i]=p.x*w;xy[2*i+1]=p.y*h});
  const fw=Math.max(...r.map(p=>p.x*w))-Math.min(...r.map(p=>p.x*w)),D=new Del(xy).triangles,T=[];
  for(let t=0;t<D.length;t+=3){const [a,b,d]=[D[t],D[t+1],D[t+2]],e=(i,j)=>Math.hypot(xy[2*i]-xy[2*j],xy[2*i+1]-xy[2*j+1]);
    if(Math.max(e(a,b),e(b,d),e(d,a))<.2*fw)T.push(a,b,d)}   // drop long sliver triangles on the outline
  return {c,r,T}}
function faceGeom(){
  const {c,r,T}=S.face,w=c.width,h=c.height,m=Math.max(w,h),zg=+$('rel').value/35,P=new Float32Array(r.length*3),UV=new Float32Array(r.length*2);
  r.forEach((p,i)=>{P.set([(p.x*w-w/2)/m,(h/2-p.y*h)/m,-p.z*w/m*zg],i*3);UV.set([p.x,1-p.y],i*2)});
  return [P,UV,T,c]}

// ---- object mode: Depth Anything -> grid
async function objectShot(bmp){
  const c=crop(bmp,0,0,bmp.width,bmp.height,518),tc=crop(bmp,0,0,bmp.width,bmp.height,1024),w=c.width,h=c.height;
  const url=URL.createObjectURL(await new Promise(r=>c.toBlob(r,'image/png')));
  st('Loading depth model...');let dp=await load('depth'),D;
  st('Estimating depth...');await tick();
  try{D=(await dp(url)).depth}catch(e){console.warn('GPU depth failed, retrying on CPU',e);st('Retrying on CPU...');delete pipes.depth;dp=await load('depth','wasm');D=(await dp(url)).depth}
  const depth=new Float32Array(w*h),alpha=new Uint8Array(w*h).fill(255);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)
    depth[y*w+x]=D.data[Math.min(D.height-1,Math.floor(y*D.height/h))*D.width+Math.min(D.width-1,Math.floor(x*D.width/w))]/255;
  if($('bg').checked){
    try{st('Loading background remover...');const bp=await load('bg');
      st('Removing background...');await tick();const [o]=await bp(url);
      for(let y=0;y<h;y++)for(let x=0;x<w;x++)
        alpha[y*w+x]=o.data[(Math.min(o.height-1,Math.floor(y*o.height/h))*o.width+Math.min(o.width-1,Math.floor(x*o.width/w)))*o.channels+(o.channels-1)];
    }catch(e){console.warn(e);st('Background removal failed, using full image.')}
  }
  let lo=1,hi=0;for(let i=0;i<w*h;i++)if(alpha[i]>127){lo=Math.min(lo,depth[i]);hi=Math.max(hi,depth[i])}
  if(hi<=lo){lo=0;hi=1}
  for(let i=0;i<w*h;i++)depth[i]=Math.min(1,Math.max(0,(depth[i]-lo)/(hi-lo)));
  return {w,h,alpha,depth:blur(depth,w,h),tc}}
function gridGeom(){
  const {w,h,alpha,depth,tc}=S,R=+$('res').value,rel=+$('rel').value/100;
  const gw=w>=h?R:Math.max(2,Math.round(R*w/h)),gh=h>w?R:Math.max(2,Math.round(R*h/w)),aw=w>=h?1:w/h,ah=h>w?1:h/w;
  const P=new Float32Array(gw*gh*3),UV=new Float32Array(gw*gh*2),m=new Uint8Array(gw*gh),T=[];
  for(let j=0;j<gh;j++)for(let i=0;i<gw;i++){
    const k=j*gw+i,sx=Math.round(i/(gw-1)*(w-1)),sy=Math.round(j/(gh-1)*(h-1)),p=sy*w+sx;
    P.set([(i/(gw-1)-.5)*aw,(.5-j/(gh-1))*ah,depth[p]*rel],k*3);UV.set([sx/(w-1),1-sy/(h-1)],k*2);m[k]=alpha[p]>127}
  for(let j=0;j<gh-1;j++)for(let i=0;i<gw-1;i++){const a=j*gw+i,b=a+1,c=a+gw,d=c+1;if(m[a]&&m[b]&&m[c]&&m[d])T.push(a,c,b,b,c,d)}
  return [P,UV,T,tc]}

async function run(file){
  if(busy)return;busy=true;let bmp;$('file').disabled=true;$('hint').style.display='none';
  try{
    bmp=await createImageBitmap(file);S=null;
    if($('mode').value==='face'){
      try{st('Loading face model...');const f=await faceShot(bmp);if(f){S={face:f};build();st('Done. Drag to rotate, pinch to zoom.');return}
        st('No face found, using object mode...')}
      catch(e){console.warn(e);st('Face mode failed ('+e.message+'), using object mode...')}
    }
    S=await objectShot(bmp);build();st('Done. Drag to rotate, pinch to zoom.');
  }catch(e){console.error(e);st('Error: '+e.message)}
  finally{busy=false;bmp?.close();$('file').disabled=false}}

// ---- any front surface -> solid textured mesh (flat back + side walls)
function solid(P,UV,T,thk){
  const n=P.length/3,pos=new Float32Array(n*6),uv=new Float32Array(n*4),idx=[],F=[],E=new Set();let zmin=1e9;
  for(let t=0;t<T.length;t+=3){let [a,b,c]=[T[t],T[t+1],T[t+2]];
    if((P[b*3]-P[a*3])*(P[c*3+1]-P[a*3+1])-(P[b*3+1]-P[a*3+1])*(P[c*3]-P[a*3])<0)[b,c]=[c,b]; // face the camera
    F.push(a,b,c);E.add(a*n+b);E.add(b*n+c);E.add(c*n+a);idx.push(a,b,c,a+n,c+n,b+n);
    zmin=Math.min(zmin,P[a*3+2],P[b*3+2],P[c*3+2])}
  for(let t=0;t<F.length;t+=3)for(let e=0;e<3;e++){const a=F[t+e],b=F[t+(e+1)%3];if(!E.has(b*n+a))idx.push(a,a+n,b,b,a+n,b+n)}
  pos.set(P);uv.set(UV);
  for(let i=0;i<n;i++){pos.set([P[i*3],P[i*3+1],zmin-thk],(i+n)*3);uv.set([UV[i*2],UV[i*2+1]],(n+i)*2)}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();g.center();return g}
let mesh=null,TEX=null;
function build(){
  if(!S)return;
  const [P,UV,T,c]=S.face?faceGeom():gridGeom();
  if(!T.length){st('Nothing found to build. Try turning off background removal.');return}
  const g=solid(P,UV,T,+$('thk').value/100);
  if(TEX?.image!==c){TEX?.dispose();TEX=new THREE.CanvasTexture(c);TEX.colorSpace=THREE.SRGBColorSpace;TEX.anisotropy=8}
  if(mesh){scene.remove(mesh);mesh.geometry.dispose()}
  mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:TEX,roughness:.9,side:THREE.DoubleSide}));
  scene.add(mesh);['glb','obj','stl'].forEach(i=>$(i).disabled=false);draw()}

// ---- export
function save(data,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4e3)}
$('glb').onclick=()=>new GLTFExporter().parse(mesh,b=>save(b,'pocket3d.glb','model/gltf-binary'),e=>st('Export failed'),{binary:true});
$('obj').onclick=()=>{const g=mesh.geometry,p=g.attributes.position,u=g.attributes.uv,ix=g.index.array,L=['mtllib pocket3d.mtl','usemtl m'];
  for(let i=0;i<p.count;i++)L.push(`v ${p.getX(i).toFixed(5)} ${p.getY(i).toFixed(5)} ${p.getZ(i).toFixed(5)}`);
  for(let i=0;i<p.count;i++)L.push(`vt ${u.getX(i).toFixed(5)} ${u.getY(i).toFixed(5)}`);
  for(let i=0;i<ix.length;i+=3)L.push(`f ${ix[i]+1}/${ix[i]+1} ${ix[i+1]+1}/${ix[i+1]+1} ${ix[i+2]+1}/${ix[i+2]+1}`);
  save(L.join('\n'),'pocket3d.obj','text/plain');save('newmtl m\nKd 1 1 1\nmap_Kd pocket3d.png','pocket3d.mtl','text/plain');
  TEX.image.toBlob(b=>save(b,'pocket3d.png','image/png'))};
$('stl').onclick=()=>{const g=mesh.geometry,p=g.attributes.position,ix=g.index.array,n=ix.length/3,buf=new ArrayBuffer(84+50*n),dv=new DataView(buf);
  dv.setUint32(80,n,true);const A=new THREE.Vector3,B=new THREE.Vector3,C=new THREE.Vector3,N=new THREE.Vector3;let o=84;
  for(let t=0;t<n;t++){A.fromBufferAttribute(p,ix[t*3]).multiplyScalar(100);B.fromBufferAttribute(p,ix[t*3+1]).multiplyScalar(100);C.fromBufferAttribute(p,ix[t*3+2]).multiplyScalar(100);
    N.subVectors(C,B).cross(N.subVectors(A,B)).normalize();
    [N,A,B,C].forEach(v=>{dv.setFloat32(o,v.x,true);dv.setFloat32(o+4,v.y,true);dv.setFloat32(o+8,v.z,true);o+=12});o+=2}
  save(buf,'pocket3d.stl','model/stl')};

// ---- UI
$('file').onchange=e=>{const f=e.target.files[0];if(f)run(f);e.target.value=''};
let tm;for(const id of['res','rel','thk'])$(id).oninput=()=>{$(id+'v').textContent=$(id).value;clearTimeout(tm);tm=setTimeout(build,120)};
</script></body></html>
